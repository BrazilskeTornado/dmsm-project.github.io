<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuraPerform Mobile Companion Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#0a0716]">
    <div id="root"></div>
    <div id="error" class="mx-auto max-w-md p-6 font-sans text-sm text-red-300"></div>

    <script>
      const { useEffect, useMemo, useState } = React;

      fetch('./MobileCompanionApp.jsx')
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load MobileCompanionApp.jsx (${response.status})`);
          }
          return response.text();
        })
        .then((source) => {
          const browserSource = source
            .replace(/import\s+\{[\s\S]*?\}\s+from\s+['"]react['"];?/, '')
            .replace(/export\s+default\s+function\s+MobileCompanionApp/, 'function MobileCompanionApp');
          const compiled = Babel.transform(browserSource, {
            presets: [['react', { runtime: 'classic' }]],
            sourceType: 'script',
          }).code;
          const componentFactory = new Function(
            'React',
            'useEffect',
            'useMemo',
            'useState',
            `${compiled}; return MobileCompanionApp;`,
          );
          const MobileCompanionApp = componentFactory(
            React,
            useEffect,
            useMemo,
            useState,
          );

          ReactDOM.createRoot(document.getElementById('root')).render(
            React.createElement(MobileCompanionApp),
          );
        })
        .catch((error) => {
          document.getElementById('error').textContent = error.message;
        });
    </script>
  </body>
</html>
